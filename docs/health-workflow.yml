# Proposed: copy this file to .github/workflows/health.yml to apply it (it was not added there; see docs/RUNBOOK.md, "Is the live site
# healthy?"). Every 6 hours it runs scripts/health_check.py against https://astroradar.io/ and, when anything fails, opens an issue
# with the problems, or comments on the one already open, so a broken site is seen within hours without anyone checking by hand.
# Merge the overnight 4 stack first: the check expects the page's app-<hash>.js file and the AVIF hero poster those PRs add.
name: Health
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, off the hour
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the live site
        id: health
        run: |
          set +e
          python3 scripts/health_check.py --base https://astroradar.io/ --max-age 120 | tee health.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update an issue when the site is not healthy
        if: steps.health.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(printf 'The health check found problems at %s UTC.\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s\nWhat to do: docs/RUNBOOK.md' "$(date -u '+%Y-%m-%d %H:%M')" "$(cat health.txt)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          open=$(gh issue list --state open --label health --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh label create health --color B60205 --description "The site health check failed" 2>/dev/null || true
               gh issue create --title "Site health check failed" --label health --body "$body"; fi
          exit 1
